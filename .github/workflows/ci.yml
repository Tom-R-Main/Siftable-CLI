name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-surface:
    name: Release surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Build CLI
        run: npm run build

      - name: Run release-critical tests
        run: >-
          npm test -- --runInBand
          test/commands/agents-work.test.ts

      - name: Run standalone release tests
        run: |
          npm run test:vitest -- src/lib/materializerDeviceIdentity.test.ts
          bun test interactive-tui/test/openFunctionWorkTools.test.ts

      - name: Verify interactive help
        run: npm run interactive:help

      - name: Verify generated manifest
        run: |
          cp oclif.manifest.json /tmp/committed-oclif.manifest.json
          npm run manifest
          diff -u \
            <(jq --sort-keys . /tmp/committed-oclif.manifest.json) \
            <(jq --sort-keys . oclif.manifest.json)
